name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Required files exist
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("skill-manifest.json", "utf8"));
            const missing = (manifest.files || []).map((f) => f.path).filter((p) => !fs.existsSync(p));
            if (missing.length > 0) {
              console.error("FAIL: missing manifest-listed files: " + missing.join(", "));
              process.exit(1);
            }
            console.log("PASS: skill-manifest.json and all " + manifest.files.length + " listed files exist");
          '

      - name: Validate manifest checksums
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const manifest = JSON.parse(fs.readFileSync("skill-manifest.json", "utf8"));
            const files = manifest.files || [];
            if (files.length === 0) {
              console.log("PASS: checksums pending (files array empty)");
              process.exit(0);
            }
            let ok = true;
            for (const entry of files) {
              const data = fs.readFileSync(entry.path);
              const hash = crypto.createHash("sha256").update(data).digest("hex");
              if (hash !== entry.sha256) {
                console.error("FAIL: checksum mismatch for " + entry.path + ": expected " + entry.sha256 + ", got " + hash);
                ok = false;
              } else {
                console.log("PASS: " + entry.path + " checksum ok");
              }
            }
            process.exit(ok ? 0 : 1);
          '

      - name: No secret material
        run: |
          matches=$(grep -R -l -E --exclude-dir=.git --exclude="validate.yml" "BEGIN OPENSSH PRIVATE KEY|BEGIN PRIVATE KEY|BEGIN PGP PRIVATE KEY BLOCK|BEGIN RSA PRIVATE KEY" . || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "FAIL: secret material detected"
            exit 1
          fi
          echo "PASS: no secret material"

      - name: SKILL.md frontmatter
        run: |
          if ! head -n 5 SKILL.md | grep -q "^name:"; then
            echo "FAIL: SKILL.md frontmatter missing name"
            exit 1
          fi
          if ! head -n 5 SKILL.md | grep -q "^description:"; then
            echo "FAIL: SKILL.md frontmatter missing description"
            exit 1
          fi
          echo "PASS: SKILL.md frontmatter"

      - name: check-install.sh syntax
        run: |
          sh -n scripts/check-install.sh
          echo "PASS: check-install.sh syntax"

      - name: Canonical-flow fixtures
        run: node scripts/validate-fixtures.mjs
